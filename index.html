<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eloi Carillon | Marine Engineer Officer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-image:
                linear-gradient(
                    rgba(0, 15, 30, 0.32),
                    rgba(0, 15, 30, 0.42)
                ),
                url("background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            inset: 0;
        }

        .content {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .name {
            font-size: 42px;
            font-weight: 400;
            letter-spacing: 7px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 45px;
            text-transform: uppercase;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .button {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            width: 300px;

            padding: 17px 20px;

            color: white;
            text-decoration: none;

            border: 1px solid rgba(255,255,255,0.45);
            background: rgba(255,255,255,0.10);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            transition: all 0.3s ease;
        }

        .button:hover {
            background: rgba(255,255,255,0.20);
            border-color: rgba(255,255,255,0.8);
        }

        .button-main {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .button-sub {
            font-size: 10px;
            letter-spacing: 1.5px;
            margin-top: 5px;
            opacity: 0.75;
        }

        .footer {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;

            text-align: center;

            font-size: 10px;
            letter-spacing: 3px;

            opacity: 0.8;

            z-index: 3;
        }


        /* MOBILE */
        @media (max-width: 600px) {

            .content {
                transform: translateY(-45px);
            }

        }

    </style>
</head>


<body>

    <div class="overlay"></div>

    <div class="content">

        <div class="name">
            ELOI CARILLON
        </div>

        <div class="title">
            MARINE ENGINEER OFFICER
        </div>


        <div class="buttons">

            <a
                class="button"
                href="https://www.linkedin.com/in/eloi-carillon-54b55a213"
                target="_blank"
            >
                <span class="button-main">
                    LinkedIn
                </span>

                <span class="button-sub">
                    Professional Profile
                </span>
            </a>


            <a
                class="button"
                href="Eloi_Carillon_CV.pdf"
                target="_blank"
            >
                <span class="button-main">
                    Personal Profile
                </span>

                <span class="button-sub">
                    View / Download CV
                </span>
            </a>


            <a
                class="button"
                href="https://wa.me/33769655115"
                target="_blank"
            >
                <span class="button-main">
                    WhatsApp
                </span>

                <span class="button-sub">
                    Contact me
                </span>
            </a>

        </div>

    </div>


    <div class="footer">
        FRANCE · AVAILABLE WORLDWIDE
    </div>

</body>
</html>
