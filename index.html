<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eloi Carillon | Marine Engineer Officer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-image:
                linear-gradient(
                    rgba(0, 15, 30, 0.32),
                    rgba(0, 15, 30, 0.42)
                ),
                url("background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 55px;
        }

        .name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 8vw, 76px);
            font-weight: 400;
            letter-spacing: 8px;
            margin-bottom: 18px;
        }

        .title {
            font-size: clamp(13px, 2vw, 17px);
            letter-spacing: 6px;
            font-weight: 300;
            text-transform: uppercase;
        }

        .line {
            width: 70px;
            height: 1px;
            background: rgba(255,255,255,0.75);
            margin: 30px auto 0;
        }

        .buttons {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .button {
            width: 100%;
            min-height: 72px;
            padding: 0 28px;

            display: flex;
            align-items: center;

            color: white;
            text-decoration: none;

            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 4px;

            background: rgba(15, 30, 45, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            transition: all 0.3s ease;
        }

        .button:hover {
            background: rgba(255,255,255,0.16);
            border-color: white;
            transform: translateY(-2px);
        }

        .icon {
            width: 42px;
            font-size: 22px;
            text-align: center;
            margin-right: 18px;
        }

        .button-text {
            flex: 1;
            text-align: left;
        }

        .button-title {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .button-subtitle {
            margin-top: 5px;
            font-size: 10px;
            letter-spacing: 1.5px;
            opacity: 0.65;
            text-transform: uppercase;
        }

        .arrow {
            font-size: 24px;
            font-weight: 200;
            opacity: 0.8;
        }

        .footer {
            position: absolute;
            bottom: 25px;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.65;
            text-align: center;
        }

        @media (max-width: 600px) {

            body {
                background-position: 60% center;
            }

            .page {
                padding: 30px 22px;
            }

            .header {
                margin-bottom: 40px;
            }

            .name {
                letter-spacing: 5px;
                font-size: 42px;
            }

            .title {
                letter-spacing: 4px;
                line-height: 1.6;
            }

            .button {
                min-height: 68px;
                padding: 0 20px;
            }

            .button-title {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .footer {
                bottom: 15px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="header">

        <div class="name">
            ELOI CARILLON
        </div>

        <div class="title">
            Marine Engineer Officer
        </div>

        <div class="line"></div>

    </div>


    <div class="buttons">

        <!-- LINKEDIN -->
        <a
            class="button"
            href="https://www.linkedin.com/in/eloi-carillon-54b55a213"
            target="_blank"
        >
            <div class="icon">in</div>

            <div class="button-text">
                <div class="button-title">
                    LinkedIn
                </div>

                <div class="button-subtitle">
                    Professional Profile
                </div>
            </div>

            <div class="arrow">
                →
            </div>
        </a>


        <!-- CV -->
        <a
            class="button"
            href="Eloi_Carillon_CV.pdf"
            target="_blank"
        >
            <div class="icon">▤</div>

            <div class="button-text">
                <div class="button-title">
                    Curriculum Vitae
                </div>

                <div class="button-subtitle">
                    View / Download CV
                </div>
            </div>

            <div class="arrow">
                →
            </div>
        </a>


        <!-- WHATSAPP -->
        <a
            class="button"
            href="https://wa.me/33769655115"
            target="_blank"
        >
            <div class="icon">◉</div>

            <div class="button-text">
                <div class="button-title">
                    WhatsApp
                </div>

                <div class="button-subtitle">
                    Contact me
                </div>
            </div>

            <div class="arrow">
                →
            </div>
        </a>

    </div>


    <div class="footer">
        France · Worldwide Availability
    </div>

</div>

</body>
</html>
